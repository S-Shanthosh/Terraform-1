version: 0.2

env:
  variables:
    TF_VERSION: "1.7.5"
    TF_DATA_DIR: "/tmp/.terraform"

phases:
  install:
    commands:
      - echo "Installing Terraform ${TF_VERSION}"
      - curl -fsSL https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip -o /tmp/terraform.zip
      - unzip -o /tmp/terraform.zip -d /usr/local/bin/
      - terraform version

  pre_build:
    commands:
      - echo "State Bucket => ${STATE_BUCKET}"
      - echo "Lock Table   => ${LOCK_TABLE}"
      - echo "Region       => ${REGION}"
      - cd Infra && terraform init -backend-config="bucket=${STATE_BUCKET}" -backend-config="key=infra/terraform.tfstate" -backend-config="region=${REGION}" -backend-config="dynamodb_table=${LOCK_TABLE}" -backend-config="encrypt=true" -reconfigure -input=false

  build:
    commands:
      - echo "Starting Terraform Auto-Destroy - $(date)"
      - cd Infra && terraform destroy -auto-approve -var-file=environments/dev/dev.tfvars -input=false || echo "DEV destroy failed or no state, continuing..."
      - cd Infra && terraform destroy -auto-approve -var-file=environments/prod/prod.tfvars -input=false || echo "PROD destroy failed or no state, continuing..."
      - echo "Auto-Destroy complete - $(date)"

  post_build:
    commands:
      - echo "Build status - ${CODEBUILD_BUILD_SUCCEEDING}"